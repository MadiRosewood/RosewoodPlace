        <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
        <script src="meta/javascript.js"></script>
        <script>
            // Function to get a cookie by its name
            function getCookie(name) {
                let cookieArr = document.cookie.split(";");

                for (let i = 0; i < cookieArr.length; i++) {
                    let cookie = cookieArr[i].trim();

                    if (cookie.startsWith(name + "=")) {
                        return cookie.substring(name.length + 1);
                    }
                }
                return null;
            }

            // Function to set a cookie
            function setCookie(name, value, days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                let expires = "expires=" + date.toUTCString();
                document.cookie = name + "=" + value + ";" + expires + ";path=/";
            }

            // Function to update visit count
            function updateVisitCount() {
                let visitCount = parseInt(getCookie('visitCount')) || 0; // Default to 0 if cookie doesn't exist
                visitCount++;

                setCookie('visitCount', visitCount, 365); // Set the cookie for 1 year

                return visitCount;
            }

            // Function to show the cookie banner
            function showCookieBanner() {
                let banner = document.getElementById('cookie-banner');
                banner.style.display = 'block';

                document.getElementById('accept-cookie').addEventListener('click', function () {
                    setCookie('cookieConsent', 'true', 365); // Store user's consent for 1 year
                    banner.style.display = 'none'; // Hide banner
                    sendVisitDataToApi();
                });
            }

            // Function to send visit count data to the GoDaddy API
            function sendVisitDataToApi() {
                let visitCount = updateVisitCount();

                // Replace the URL with the GoDaddy API or any endpoint you are using
                const apiUrl = 'https://api.godaddy.com/v1/your-endpoint';

                // Prepare your request headers (adjust based on GoDaddy's API authentication method)
                let headers = new Headers();
                headers.append('Content-Type', 'application/json');
                headers.append('Authorization', 'Bearer your_api_token'); // Authentication token

                let data = {
                    visitCount: visitCount
                };

                // Send data to API using fetch
                fetch(apiUrl, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(data)
                })
                    .then(response => response.json())
                    .then(data => console.log('Visit data sent successfully:', data))
                    .catch(error => console.error('Error sending visit data:', error));
            }

            // Check if the user has accepted the cookie consent
            if (!getCookie('cookieConsent')) {
                showCookieBanner();
            } else {
                // If consent is already given, track the visit and send the data
                sendVisitDataToApi();
            }
        </script>
</body>
